[project]
name = "ect-backend"
version = "0.1.0"
description = "English Communication Trainer - local backend (FastAPI + WhisperX + Silero VAD)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "torch>=2.6",
    "torchaudio>=2.6",
    "whisperx>=3.4",
    "silero-vad>=5.1",
    "onnx-asr[gpu,hub]>=0.12.0",
]

[project.scripts]
# The command surface the Claude Code skills drive. `uv run python -m app.cli` is
# equivalent and works even if the console script isn't regenerated.
ect = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline"]

# Pull torch/torchaudio from the CUDA 12.6 wheel index. The RTX 3060 Laptop
# (driver 610.62 / CUDA 13.3) is backward compatible with cu126 runtimes, and
# these wheels bundle cuDNN 9, which CTranslate2 >= 4.5 requires.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Pinned explicitly: ruff's default rule set widens between releases, and a lint
# command that changes meaning on upgrade is not worth running.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "S", "BLE", "DTZ", "ISC"]
ignore = [
    # The pipeline crosses two boundaries where any exception must degrade rather than
    # propagate: model loading walks a compute-type fallback ladder, and the VAD and
    # alignment stages are accuracy upgrades whose failure must not lose a recording.
    # Each site logs what it swallowed.
    "BLE001",  # blind-except
    "S110",    # try-except-pass
    "S112",    # try-except-continue
    # torch, whisperx and silero are imported inside the functions that use them, on
    # purpose: at module level, `ect db init` would load ~2 GB of CUDA libraries before
    # touching the database, and the tests could not run without the GPU stack present.
    "PLC0415", # import not at top of file
    # Every subprocess call is ffmpeg, invoked with an argument list and no shell.
    "S603",    # subprocess call
    "PLR0913", # many arguments - the payload builders genuinely take that many
    "PLR2004", # magic values - thresholds read better inline than as constants
]

[tool.ruff.lint.per-file-ignores]
# `File(...)` / `Query(...)` in defaults is the FastAPI dependency idiom.
"app/routers/*.py" = ["B008"]
# Tests import inside fixtures on purpose: `settings` is redirected to a temp
# directory before the app modules that read it are imported.
"tests/*.py" = ["S101", "PLC0415", "I001"]
