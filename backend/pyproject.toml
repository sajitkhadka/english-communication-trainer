[project]
name = "ect-backend"
version = "0.1.0"
description = "English Communication Trainer - local backend (FastAPI + WhisperX + Silero VAD)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "torch>=2.6",
    "torchaudio>=2.6",
    "whisperx>=3.4",
    "silero-vad>=5.1",
]

[project.scripts]
# The command surface the Claude Code skills drive. `uv run python -m app.cli` is
# equivalent and works even if the console script isn't regenerated.
ect = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline"]

# Pull torch/torchaudio from the CUDA 12.6 wheel index. The RTX 3060 Laptop
# (driver 610.62 / CUDA 13.3) is backward compatible with cu126 runtimes, and
# these wheels bundle cuDNN 9, which CTranslate2 >= 4.5 requires.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
